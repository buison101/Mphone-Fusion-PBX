<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Softphone.Pro Team — HTML replica</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Design tokens — trích trực tiếp từ mteam.softphone.pro
   ========================================================================== */
:root{
  --primary:#3068F4; --primary-dark:#2B5ACE; --primary-soft:#CEDBFC; --primary-underline:#D6E1FD;
  --secondary:#8897AA; --success:#02BC77; --info:#28C3D7; --warning:#FF7E08; --danger:#D9534F;
  --acw:#1E70CD;
  --bg-page:#F7F8FA; --surface:#fff;
  --text:#4E5155; --text-2:#707070; --muted:#8897AA; --disabled:#A3A4A6;
  --border:rgba(24,28,33,.06); --border-strong:rgba(24,28,33,.1); --border-input:#EAEAEA; --divider:#DADADA;
  --badge-blue-bg:#F0F4FF; --badge-blue-fg:#6F9CFF;
  --badge-yellow-bg:#FFEDB0; --badge-yellow-fg:#865203;
  --radius:.25rem;
  --shadow-card:0 1px 6px rgba(0,0,0,.09);
  --shadow-dd:0 0 6px 0 rgba(0,0,0,.16);
  --shadow-navbar:0 1px 0 0 rgba(24,28,33,.06);
  --fs-xs:.625rem; --fs-sm:.75rem; --fs-base:.894rem; --fs-md:1rem;
  --gap-1:.25rem; --gap-2:.5rem; --gap-3:.75rem; --gap-4:1rem;
}
*{box-sizing:border-box}
html{font-size:16px}
svg{flex:none}
.caret{width:9px;height:9px;fill:currentColor}
.ico-sm{width:13px;height:13px;fill:currentColor;vertical-align:-2px;margin-right:5px}
body{
  margin:0; background:var(--bg-page); color:var(--text);
  font-family:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",sans-serif;
  font-size:var(--fs-base); font-weight:400; line-height:1.47; text-align:left;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- Top navbar ---------- */
.topbar{
  background:var(--primary); color:#fff; height:48px;
  display:flex; align-items:center; gap:0; padding:0 24px;
  box-shadow:var(--shadow-navbar); position:relative; z-index:20;
}
.brand{display:flex;align-items:center;margin-right:22px}
.brand .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.brand .logo svg{width:26px;height:26px;fill:var(--primary)}
.mainnav{display:flex;align-items:center;gap:0;list-style:none;margin:0;padding:0;height:100%}
.mainnav li{height:100%}
.mainnav a{
  display:flex;align-items:center;height:100%;padding:0 13px;
  color:rgba(255,255,255,.8); font-size:var(--fs-md); position:relative; white-space:nowrap;
}
.mainnav a:hover{color:#fff}
.mainnav a.active{color:#fff;font-weight:400}
.mainnav a.active::after{content:"";position:absolute;left:13px;right:13px;bottom:6px;height:2px;background:#fff}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:18px}
.bell{width:18px;height:18px;fill:rgba(255,255,255,.9);cursor:pointer}
.companyid{font-size:var(--fs-base);color:rgba(255,255,255,.95)}
.userbox{display:flex;align-items:center;gap:9px;cursor:pointer;position:relative}
.avatar{
  width:30px;height:30px;border-radius:50%;background:#B7BEAE;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);font-weight:500;letter-spacing:.02em;
}
.userbox .caret{width:9px;height:9px;fill:rgba(255,255,255,.85)}
.dropdown-menu{
  position:absolute;top:calc(100% + 10px);right:0;min-width:190px;background:#fff;
  border-radius:var(--radius);box-shadow:var(--shadow-dd);padding:6px 0;display:none;z-index:40;
}
.dropdown-menu.open{display:block}
.dropdown-menu a{display:flex;align-items:center;gap:9px;padding:8px 16px;color:var(--text);font-size:var(--fs-base)}
.dropdown-menu a:hover{background:rgba(24,28,33,.03)}

/* ---------- Sub navbar ---------- */
.subnav{background:var(--primary-dark);height:31px;display:flex;align-items:stretch;padding:0 24px;position:relative;z-index:19}
.subnav a{
  display:flex;align-items:center;padding:0 14px;color:var(--primary-soft);
  font-size:var(--fs-base);position:relative;white-space:nowrap;
}
.subnav a:first-child{padding-left:0}
.subnav a:hover{color:#fff}
.subnav a.active{color:#fff;box-shadow:0 -2px 0 0 var(--primary-underline) inset}
.subnav .caret{width:8px;height:8px;margin-left:6px;fill:currentColor;opacity:.8}

/* ---------- Layout ---------- */
.content{padding:22px 24px 40px}
.row{display:flex;gap:24px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-card)}

/* ---------- Buttons ---------- */
.btn{
  white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid transparent;border-radius:var(--radius);
  padding:.45rem .95rem;font-size:var(--fs-base);line-height:1.47;cursor:pointer;
  background:transparent;transition:background .12s,box-shadow .12s;
}
.btn:focus{outline:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:focus{box-shadow:0 0 0 2px rgba(48,104,244,.4)}
.btn-primary.soft{background:#7FA0F8}
.btn-primary.soft:hover{background:#6a91f7}
.btn-sm{padding:.3rem .7rem;font-size:var(--fs-base)}
.btn-light{background:var(--surface);color:var(--text)}
.btn-ghost{color:var(--disabled);cursor:default}
.btn-group{display:inline-flex}
.btn-group .btn:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.btn-group .btn:last-child{border-top-left-radius:0;border-bottom-left-radius:0;padding-left:.55rem;padding-right:.55rem;border-left:1px solid rgba(255,255,255,.25)}

/* ---------- Chips / status pills ---------- */
.chips{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:8px;padding:.42rem .85rem;
  border-radius:var(--radius);font-size:var(--fs-base);background:transparent;color:var(--text);cursor:pointer;
}
.chip.active{background:var(--primary);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.online{background:var(--success)} .dot.working{background:var(--danger)}
.dot.away{background:var(--warning)} .dot.offline{background:var(--secondary)}
.dot.oncall{background:var(--primary)} .dot.acw{background:var(--acw)}
.dot.ringing{background:var(--danger)}

/* ---------- Stat widgets ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.stat{position:relative;padding:20px 22px;min-height:104px}
.stat .val{font-size:1.7rem;font-weight:400;line-height:1.2;color:var(--text)}
.stat .lbl{font-size:var(--fs-sm);color:var(--text-2);margin-top:6px}
.stat .ico{
  position:absolute;top:18px;right:20px;width:34px;height:34px;border-radius:50%;
  background:rgba(48,104,244,.10);display:flex;align-items:center;justify-content:center;
}
.stat .ico svg{width:16px!important;height:16px!important;fill:var(--primary);opacity:.85;margin:0}

/* ---------- Chart block ---------- */
.chartwrap{margin-top:22px}
.chart-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.chart-head .title{font-size:var(--fs-base)}
.legend{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-base);color:var(--text)}
.legend i{width:11px;height:11px;border:2px solid var(--info);border-radius:2px;display:inline-block}
.select-inline{
  margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:#fff;
  border:1px solid var(--border-input);border-radius:var(--radius);padding:.32rem .6rem;font-size:var(--fs-base);cursor:pointer;
}
.select-inline .caret{width:9px;height:9px;fill:var(--muted)}

/* ---------- Tables ---------- */
.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:var(--fs-base)}
.tbl th,.tbl td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border-input);vertical-align:middle}
.tbl thead th{font-weight:400;color:var(--text);border-bottom:1px solid var(--border-input);white-space:nowrap}
.tbl thead th.grp{text-align:center;border-left:1px solid var(--border-input);border-bottom:1px solid var(--border-input)}
.tbl thead tr.sub th{font-size:var(--fs-base);color:var(--text);padding-top:8px;padding-bottom:8px}
.tbl .colsep{border-left:1px solid var(--border-input)}
.sortico{width:11px;height:11px;fill:var(--primary);opacity:.85;margin-left:6px;vertical-align:-1px}
.help{width:12px;height:12px;fill:var(--muted);margin-left:4px;vertical-align:-2px}
.tbl tbody tr:hover{background:rgba(48,104,244,.03)}
.filterrow input,.filterrow .fakeselect{
  width:100%;border:1px solid var(--border-input);border-radius:var(--radius);
  padding:.3rem .5rem;font-size:var(--fs-sm);color:var(--text);background:#fff;
}
.filterrow input::placeholder{color:var(--disabled)}
.filterrow .fakeselect{display:flex;align-items:center;justify-content:space-between;color:var(--disabled);cursor:pointer}
.filterrow .fakeselect .caret{width:8px;height:8px;fill:var(--muted)}
.searchwrap{position:relative}
.searchwrap svg{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:12px!important;height:12px!important;fill:var(--muted);margin:0}
.agentcell{display:flex;align-items:center;gap:10px}
.agentcell .who{min-width:0}
.agentcell .who a{display:block;line-height:1.3}
.agentcell .avatar{width:26px;height:26px;font-size:var(--fs-xs);background:#B7BEAE}
.agentcell a{color:var(--primary)}
.badge{display:inline-block;padding:.12rem .5rem;border-radius:var(--radius);font-size:1em}
.badge.blue{background:var(--badge-blue-bg);color:var(--badge-blue-fg)}
.badge.yellow{background:var(--badge-yellow-bg);color:var(--badge-yellow-fg)}
.status-txt{display:inline-flex;align-items:center;gap:7px}
.status-txt.online{color:var(--success)} .status-txt.away{color:var(--warning)}
.status-txt.offline{color:var(--secondary)} .status-txt.ringing{color:var(--danger)}
.status-txt.oncall{color:var(--primary)} .status-txt.acw{color:var(--acw)}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.toolbar{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:var(--fs-base)}
.perpage a{color:var(--primary);margin-left:9px}
.perpage a.active{color:var(--primary);font-weight:500;text-decoration:underline}
.switcher{position:relative;display:inline-block;width:2.375rem;height:1.375rem;flex:none}
.switcher input{display:none}
.switcher .ind{position:absolute;inset:0;background:#C8C8C8;border-radius:10rem;transition:background .15s}
.switcher .ind::after{
  content:"";position:absolute;top:2px;left:2px;width:1.05rem;height:1.05rem;border-radius:50%;
  background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.switcher input:checked + .ind{background:var(--primary)}
.switcher input:checked + .ind::after{left:calc(100% - 1.15rem)}

/* ---------- Empty state ---------- */
.empty{padding:70px 0;text-align:center;color:var(--text)}
.empty svg{width:56px;height:40px;fill:var(--disabled);opacity:.55;display:block;margin:0 auto 14px}

/* ---------- Forms (Settings) ---------- */
.formwrap{max-width:580px}
.formgroup{margin-bottom:20px}
.formgroup label{display:block;font-size:var(--fs-base);color:var(--text);margin-bottom:7px}
.formgroup .ctrl{
  width:100%;height:38px;border:1px solid var(--border-input);border-radius:var(--radius);
  background:#fff;display:flex;align-items:center;padding:0 12px;font-size:var(--fs-base);
}
.formgroup .ctrl .caret{margin-left:auto;width:9px;height:9px;fill:var(--muted)}
.formgroup .ctrl input{border:0;outline:0;flex:1;font:inherit;color:inherit}
.formgroup .ctrl input::placeholder{color:var(--disabled)}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.pagehead h4{margin:0;font-size:1.3rem;font-weight:400}
.pagehead .btn{margin-left:auto}
.bigavatar{width:120px;height:120px;border-radius:50%;background:#B7BEAE;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:500}
.notice{background:#F4F4F4;border-radius:var(--radius);padding:18px 22px;font-size:var(--fs-base);margin-bottom:24px}
.notice p{margin:0 0 12px}
.notice p:last-child{margin-bottom:0}
.sectionhead{font-size:1.05rem;font-weight:400;margin:26px 0 16px}
.switchrow{display:flex;align-items:center;gap:12px;margin:18px 0}

/* ---------- Payments ---------- */
.subcard{max-width:400px;margin:26px auto 0;padding:26px 34px}
.subcard h5{text-align:center;font-weight:400;font-size:var(--fs-base);margin:0 0 24px}
.kvrow{display:flex;align-items:baseline;gap:8px;margin-bottom:18px;font-size:var(--fs-base)}
.kvrow .k{color:var(--muted)}
.kvrow .fill{flex:1;border-bottom:1px solid var(--divider);transform:translateY(-3px)}
.kvrow .v{color:var(--text)}
.kvrow .v.red{color:var(--danger)}
.centertitle{text-align:center;font-size:var(--fs-md);margin:8px 0 0}

/* ---------- Date presets (Reporting) ---------- */
.presets{display:inline-flex;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-card)}
.presets a{padding:.5rem .95rem;font-size:var(--fs-base);color:var(--text);border-right:1px solid var(--border-input)}
.presets a:last-child{border-right:0}
.presets a.active{color:var(--primary)}
.daterange{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:var(--radius);
  box-shadow:var(--shadow-card);padding:.5rem .9rem;font-size:var(--fs-base);margin-left:22px}
.daterange svg{width:14px;height:14px;fill:var(--text-2)}
.granularity{margin-left:auto;display:inline-flex;gap:0}
.granularity a{padding:.5rem .8rem;font-size:var(--fs-base);color:var(--disabled)}
.granularity a.active{color:var(--primary)}

.hint{margin:26px 24px 0;font-size:var(--fs-sm);color:var(--muted)}
</style>
</head>

function lineChart(data,w=1160,h=250){
  const pad={l:34,r:10,t:12,b:26};
  const max=Math.max(...data,1), iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const x=i=>pad.l+iw*i/(data.length-1), y=v=>pad.t+ih-(v/max)*ih;
  const pts=data.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${pad.l},${pad.t+ih} ${pts} ${pad.l+iw},${pad.t+ih}`;
  const ticks=[0,Math.round(max/2),max];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block" role="img" aria-label="Biểu đồ số cuộc gọi theo giờ">
    ${ticks.map(t=>`<g><line x1="${pad.l}" x2="${w-pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="#EEE"/>
      <text x="${pad.l-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#8897AA">${t}</text></g>`).join('')}
    <polygon points="${area}" fill="rgba(40,195,215,.10)"/>
    <polyline points="${pts}" fill="none" stroke="#28C3D7" stroke-width="2" stroke-linejoin="round"/>
    ${data.map((v,i)=>i%3===0?`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#fff" stroke="#28C3D7" stroke-width="2"/>`:'').join('')}
    <line x1="${pad.l}" x2="${w-pad.r}" y1="${pad.t+ih}" y2="${pad.t+ih}" stroke="#DADADA"/>
    ${[0,6,12,18,23].map(i=>`<text x="${x(i)}" y="${h-6}" text-anchor="middle" font-size="11" fill="#8897AA">${String(i).padStart(2,'0')}:00</text>`).join('')}
  </svg>`;
}

/* ====================== ROUTER ====================== */
function render(page){
  document.querySelectorAll('.mainnav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));
  const sn=document.getElementById('subnav');
  const items=SUBNAV[page]||[];
  sn.style.display = items.length ? 'flex' : 'none';
  sn.innerHTML = items.map(([t,act,car])=>`<a href="#" class="${act?'active':''}">${t}${car?I.caret:''}</a>`).join('');
  sn.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();sn.querySelectorAll('a').forEach(x=>x.classList.remove('active'));a.classList.add('active')});
  document.getElementById('view').innerHTML = PAGES[page]();
}
document.querySelectorAll('.mainnav a').forEach(a=>a.onclick=e=>{e.preventDefault();render(a.dataset.page)});
document.getElementById('userbox').onclick=e=>{e.stopPropagation();document.getElementById('usermenu').classList.toggle('open')};
document.body.onclick=()=>document.getElementById('usermenu').classList.remove('open');
render('dashboard');
